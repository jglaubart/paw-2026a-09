<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#141414;color:#ffffff;font-family:'Segoe UI',Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;background:#141414;">
    <tr>
        <td align="center">
            <table role="presentation" width="560" cellpadding="0" cellspacing="0"
                   style="max-width:560px;width:100%;background:linear-gradient(180deg,#1d1d1d 0%,#161616 100%);border:1px solid rgba(255,255,255,0.1);border-radius:24px;overflow:hidden;box-shadow:0 24px 56px rgba(0,0,0,0.45);">

                <tr>
                    <td style="padding:26px 32px;background:#000000;border-bottom:1px solid rgba(255,255,255,0.06);">
                        <div style="color:#ba9eff;font-size:22px;font-weight:800;letter-spacing:0.28em;">PLATEA</div>
                    </td>
                </tr>

                <tr>
                    <td style="padding:38px 40px 12px;">
                        <p style="margin:0 0 14px;color:#f5a623;text-transform:uppercase;letter-spacing:0.18em;font-size:11px;font-weight:700;"
                           th:text="#{mail.productora.confirmation.kicker}">Solicitud recibida</p>
                        <h1 style="margin:0 0 18px;font-size:28px;line-height:1.15;color:#ffffff;letter-spacing:-0.02em;"
                            th:text="#{mail.productora.confirmation.title(${username})}">Hola, recibimos tu solicitud</h1>
                        <p style="margin:0 0 10px;color:rgba(255,255,255,0.78);font-size:15px;line-height:1.55;"
                           th:text="#{mail.productora.confirmation.body}">Vamos a revisar la informacion.</p>
                    </td>
                </tr>

                <tr>
                    <td style="padding:16px 40px 12px;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                               style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;">
                            <tr>
                                <td style="padding:18px 22px;">
                                    <p style="margin:0 0 4px;color:rgba(255,255,255,0.48);font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;">Nombre de la productora</p>
                                    <p style="margin:0;color:#ffffff;font-size:15px;font-weight:700;" th:text="${productoraName}">Nombre</p>
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:0 22px 18px;">
                                    <p style="margin:0 0 4px;color:rgba(255,255,255,0.48);font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;">Número de solicitud</p>
                                    <p style="margin:0;color:rgba(255,255,255,0.72);font-size:14px;" th:text="'#' + ${requestId}">Número</p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td style="padding:24px 40px 32px;">
                        <p style="margin:0;color:rgba(255,255,255,0.48);font-size:12px;line-height:1.55;"
                           th:text="#{mail.productora.confirmation.footer}">Si no solicitaste esto, ignora este mensaje.</p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
