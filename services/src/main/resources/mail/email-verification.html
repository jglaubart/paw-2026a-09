<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#141414;color:#ffffff;font-family:'Segoe UI',Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;background:#141414;">
    <tr>
        <td align="center">
            <table role="presentation" width="560" cellpadding="0" cellspacing="0"
                   style="max-width:560px;width:100%;background:linear-gradient(180deg,#1d1d1d 0%,#161616 100%);border:1px solid rgba(255,255,255,0.1);border-radius:24px;overflow:hidden;box-shadow:0 24px 56px rgba(0,0,0,0.45);">

                <tr>
                    <td style="padding:26px 32px;background:#000000;border-bottom:1px solid rgba(255,255,255,0.06);">
                        <div style="color:#ba9eff;font-size:22px;font-weight:800;letter-spacing:0.28em;">PLATEA</div>
                    </td>
                </tr>

                <tr>
                    <td style="padding:38px 40px 12px;">
                        <p style="margin:0 0 14px;color:#ba9eff;text-transform:uppercase;letter-spacing:0.18em;font-size:11px;font-weight:700;"
                           th:text="#{mail.verification.kicker}">Verifica tu email</p>
                        <h1 style="margin:0 0 18px;font-size:28px;line-height:1.15;color:#ffffff;letter-spacing:-0.02em;"
                            th:text="#{mail.verification.title(${username})}">Hola, confirmanos tu email</h1>
                        <p style="margin:0 0 10px;color:rgba(255,255,255,0.78);font-size:15px;line-height:1.55;"
                           th:text="#{mail.verification.body}">Usa este codigo para terminar tu registro en Platea.</p>
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding:10px 40px 8px;">
                        <table role="presentation" cellpadding="0" cellspacing="0">
                            <tr>
                                <th:block th:each="digit : ${codeDigits}">
                                    <td style="padding:6px;">
                                        <div style="width:56px;height:68px;border:1px solid rgba(186,158,255,0.35);border-radius:16px;background:linear-gradient(180deg,rgba(186,158,255,0.14) 0%,rgba(132,85,239,0.06) 100%);color:#ffffff;font-size:34px;font-weight:800;line-height:68px;text-align:center;letter-spacing:0;box-shadow:inset 0 1px 0 rgba(255,255,255,0.08),0 12px 24px rgba(132,85,239,0.18);"
                                             th:text="${digit}">0</div>
                                    </td>
                                </th:block>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding:4px 40px 10px;">
                        <p style="margin:0;color:rgba(255,255,255,0.48);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;"
                           th:text="#{mail.verification.codeLabel}">Codigo de verificacion</p>
                    </td>
                </tr>

                <tr>
                    <td style="padding:22px 40px 8px;">
                        <p style="margin:0;color:rgba(255,255,255,0.72);font-size:14px;line-height:1.55;"
                           th:text="#{mail.verification.expires}">El codigo vence en 15 minutos.</p>
                    </td>
                </tr>

                <tr>
                    <td style="padding:10px 40px 32px;">
                        <p style="margin:0;color:rgba(255,255,255,0.48);font-size:12px;line-height:1.55;"
                           th:text="#{mail.verification.footer}">Si no fuiste vos, ignora este mensaje.</p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
