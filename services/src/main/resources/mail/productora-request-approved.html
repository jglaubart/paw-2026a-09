<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#141414;color:#ffffff;font-family:'Segoe UI',Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;background:#141414;">
    <tr>
        <td align="center">
            <table role="presentation" width="560" cellpadding="0" cellspacing="0"
                   style="max-width:560px;width:100%;background:linear-gradient(180deg,#1d1d1d 0%,#161616 100%);border:1px solid rgba(255,255,255,0.1);border-radius:24px;overflow:hidden;box-shadow:0 24px 56px rgba(0,0,0,0.45);">

                <tr>
                    <td style="padding:26px 32px;background:#000000;border-bottom:1px solid rgba(255,255,255,0.06);">
                        <div style="color:#ba9eff;font-size:22px;font-weight:800;letter-spacing:0.28em;">PLATEA</div>
                    </td>
                </tr>

                <tr>
                    <td style="padding:38px 40px 12px;">
                        <p style="margin:0 0 14px;color:#4ade80;text-transform:uppercase;letter-spacing:0.18em;font-size:11px;font-weight:700;"
                           th:text="#{mail.productora.approved.kicker}">Solicitud aprobada</p>
                        <h1 style="margin:0 0 18px;font-size:28px;line-height:1.15;color:#ffffff;letter-spacing:-0.02em;"
                            th:text="#{mail.productora.approved.title(${username})}">Hola, tu productora ya esta activa</h1>
                        <p style="margin:0 0 10px;color:rgba(255,255,255,0.78);font-size:15px;line-height:1.55;"
                           th:text="#{mail.productora.approved.body}">Tu solicitud fue aprobada.</p>
                    </td>
                </tr>

                <tr th:if="${adminNotes != null and !#strings.isEmpty(adminNotes)}">
                    <td style="padding:8px 40px 8px;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                               style="background:rgba(74,222,128,0.07);border:1px solid rgba(74,222,128,0.2);border-left:3px solid #4ade80;border-radius:12px;">
                            <tr>
                                <td style="padding:16px 20px;">
                                    <p style="margin:0 0 6px;color:#4ade80;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;"
                                       th:text="#{mail.productora.approved.notes('')}">Notas del equipo</p>
                                    <p style="margin:0;color:rgba(255,255,255,0.82);font-size:14px;line-height:1.55;"
                                       th:text="${adminNotes}">Notas</p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding:28px 40px 12px;">
                        <a th:href="${ctaUrl}" href="#"
                           style="display:inline-block;padding:14px 28px;border-radius:999px;background:linear-gradient(135deg,#ba9eff 0%,#8455ef 100%);color:#0b0714;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;font-size:13px;text-decoration:none;box-shadow:0 12px 24px rgba(132,85,239,0.28);"
                           th:text="${ctaLabel}">Ir a mi productora</a>
                    </td>
                </tr>

                <tr>
                    <td style="padding:10px 40px 32px;">
                        <p style="margin:0;color:rgba(255,255,255,0.48);font-size:12px;line-height:1.55;">
                            <span th:text="#{mail.reset.fallback}">Si el boton no funciona, copia y pega:</span>
                        </p>
                        <p style="margin:6px 0 0;word-break:break-all;">
                            <a th:href="${ctaUrl}" th:text="${ctaUrl}" href="#"
                               style="color:#ba9eff;font-size:12px;text-decoration:underline;"></a>
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
